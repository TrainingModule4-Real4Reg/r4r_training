[project]
name = "r4r-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "causalml>=0.16.0",
    "ipykernel>=7.2.0",
    "matplotlib",
    "pandas",
    "pytmle>=0.4.2",
    "seaborn",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
